<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Generate a</h1>
        <h1 class="green">random password</h1>
            <p>Never use an insecured password again.</p>

        <label for="range-slider">Select Password Length (8 to 15):</label>
        <input type="range" id="range-slider" min="8" max="15" value="15">
        <p>Selected Value: <span id="slider-value">8</span></p>
        <label><input type="checkbox" id="includeNumbers" checked> Include Numbers</label>
        <br>
        <label><input type="checkbox" id="includeSymbols" checked> Include Special Characters</label>
        <br>
        <br>
        <button id="button">Generate passwords</button>


        <hr>
        <div class="passwords">
                <div class="pass" id="password1">Password</div>
                <div class="pass" id="password2">Password</div>
        </div>
    </div>
<script src="index.js"></script>
</body>
</html>
